# 毎日、NEUTRINO対応PRのソースを確かめ、前回の配布から変わっていれば Mac / Windows 版をビルドして Release を出す。
# 2種類を作る。どちらも同じ Release に入れる (Release は日本時間の日ごとに1つ。作らなかった版は前の Release から持ってくる)。
#   固定版 (fixed):  PR のソース + packaging/extra-commits.txt。OpenUtau 本体は PR が取り込んだ版のまま。
#   最新版 (latest): PR のソースに本家 OpenUtau の master を混ぜ + packaging/extra-commits-latest.txt。
#                    本家の master が動いた時も作り直す。作れなかった時は固定版だけを出す。
# アプリの版は、それぞれが取り込んでいる本家 OpenUtau の版 (例: 0.1.570.3) にする。
# PR が本家にマージされていたら、ビルドせずに本家の Release ページへのリンクを出し、この workflow を無効にして止まる。
name: NEUTRINO release

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST
  # 足すコミットの一覧かこの workflow を変えたら、朝を待たずに確かめる。
  # 説明文の部品だけを変えた時は、ビルドせずに README と Release の本文だけを作り直す。
  push:
    branches: [release-kit]
    paths:
      - packaging/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      force:
        description: "ソースが前回と同じでも作り直す"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: neutrino-release
  cancel-in-progress: false

env:
  PR_REPO: openutau/OpenUtau
  PR_NUMBER: "2136"
  SRC_REPO: rokujyushi/OpenUtau
  SRC_REF: neutrino
  UPSTREAM_REPO: openutau/OpenUtau
  UPSTREAM_REF: master
  UPSTREAM_RELEASES: https://github.com/openutau/OpenUtau/releases
  UPDATER_FILE: OpenUtau/ViewModels/UpdaterViewModel.cs
  UPDATER_URL: https://api.github.com/repos/stakira/OpenUtau/releases?per_page=100

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.r.outputs.action }}
      flavors: ${{ steps.r.outputs.flavors }}
      sha: ${{ steps.r.outputs.sha }}
      date: ${{ steps.r.outputs.date }}
      version: ${{ steps.r.outputs.version }}
      upstream_sha: ${{ steps.r.outputs.upstream_sha }}
      upstream_date: ${{ steps.r.outputs.upstream_date }}
      latest_version: ${{ steps.r.outputs.latest_version }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          merged=$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq .merged)
          if [ "$merged" = "true" ]; then
            echo "action=merged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(gh api "repos/$SRC_REPO/commits/$SRC_REF" --jq .sha)
          date=$(gh api "repos/$SRC_REPO/commits/$sha" --jq '.commit.committer.date[:10]')
          up=$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_REF" --jq .sha)
          up_date=$(gh api "repos/$UPSTREAM_REPO/commits/$up" --jq '.commit.committer.date[:10]')
          { echo "sha=$sha"; echo "date=$date"; echo "upstream_sha=$up"; echo "upstream_date=$up_date"; } >> "$GITHUB_OUTPUT"
          st=state/last-build.json
          list() { awk '!/^[[:space:]]*(#|$)/ {print $1}' "$1" | sort | paste -sd, -; }
          was() { jq -r "$1" "$st"; }
          flavors=()
          # 固定版: PR のソースか、足すコミットの一覧が変わった時
          if [ "$sha" != "$(was '.source_sha // ""')" ] \
            || [ "$(list packaging/extra-commits.txt)" != "$(was '(.extra_commits // []) | sort | join(",")')" ] \
            || [ "$FORCE" = "true" ]; then
            flavors+=(fixed)
          fi
          # 最新版: それに加えて、本家の master が動いた時も
          if [ "$sha" != "$(was '.latest.source_sha // ""')" ] || [ "$up" != "$(was '.latest.upstream_sha // ""')" ] \
            || [ "$(list packaging/extra-commits-latest.txt)" != "$(was '(.latest.extra_commits // []) | sort | join(",")')" ] \
            || [ "$FORCE" = "true" ]; then
            flavors+=(latest)
          fi
          if [ ${#flavors[@]} -eq 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "action=docs" >> "$GITHUB_OUTPUT"   # 説明文だけを作り直す
            else
              echo "action=skip" >> "$GITHUB_OUTPUT"
            fi
            echo "unchanged: $sha / upstream $up"
            exit 0
          fi
          echo "action=build" >> "$GITHUB_OUTPUT"
          echo "flavors=$(printf '%s\n' "${flavors[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          ver() {
            local v; v=$(packaging/base-version.sh "$1" "$2" || true)
            if [ -z "$v" ]; then
              v="0.0.${GITHUB_RUN_NUMBER}"
              echo "::warning::$1 の $2 が本家のどの版か分からないので、版を ${v} にします" >&2
            fi
            echo "$v"
          }
          echo "version=$(ver "$SRC_REPO" "$sha")" >> "$GITHUB_OUTPUT"
          echo "latest_version=$(ver "$UPSTREAM_REPO" "$up")" >> "$GITHUB_OUTPUT"
      # 60日間 repo に動きが無いと GitHub が定期実行を止めるので、ソースが動かない時も月1回だけ記録を残す。
      - if: steps.r.outputs.action == 'skip'
        run: |
          set -euo pipefail
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((30*86400)) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > state/last-check.txt
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/last-check.txt && git commit -m "chore: keepalive check"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  merged:
    needs: check
    if: needs.check.outputs.action == 'merged'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          note="NEUTRINO対応は本家OpenUtauに取り込まれました(openutau/OpenUtau#${PR_NUMBER})。今後は本家の配布版を使ってください: ${UPSTREAM_RELEASES}"
          { echo "> [!IMPORTANT]"; echo "> ${note}"; echo "> この配布元の自動ビルドは終了しました。"; echo; cat README.md; } > README.new && mv README.new README.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md && git commit -m "docs: 本家へのマージを案内して配布を終了"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          gh release create upstream-merged --target "$GITHUB_REF_NAME" --latest \
            --title "本家OpenUtauに取り込まれました" \
            --notes "${note}"$'\n\n'"この配布元の自動ビルドは終了しました。過去のビルドは下の Releases に残しています。"
          gh workflow disable "${{ github.workflow }}"

  mac:
    needs: check
    if: needs.check.outputs.action == 'build'
    name: mac (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.check.outputs.flavors) }}
    runs-on: macos-15
    env:
      FLAVOR: ${{ matrix.flavor }}
      SUFFIX: ${{ matrix.flavor == 'latest' && '-latest' || '' }}
      EXTRA: ${{ matrix.flavor == 'latest' && 'extra-commits-latest.txt' || 'extra-commits.txt' }}
      VERSION: ${{ matrix.flavor == 'latest' && needs.check.outputs.latest_version || needs.check.outputs.version }}
      SOURCE_REPO: rokujyushi/OpenUtau
      SOURCE_REF: neutrino
      SOURCE_SHA: ${{ needs.check.outputs.sha }}
      SOURCE_DATE: ${{ needs.check.outputs.date }}
      BASE_VERSION: ${{ needs.check.outputs.version }}
      LATEST_VERSION: ${{ needs.check.outputs.latest_version }}
      LATEST_UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      LATEST_UPSTREAM_DATE: ${{ needs.check.outputs.upstream_date }}
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }
      - uses: actions/checkout@v4
        with:
          repository: "${{ env.SRC_REPO }}"
          ref: "${{ needs.check.outputs.sha }}"
          path: src
          # 最新版は本家と混ぜるので、共通の祖先まで辿れる履歴が要る
          fetch-depth: ${{ matrix.flavor == 'latest' && '0' || '1' }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Merge the latest OpenUtau
        if: matrix.flavor == 'latest'
        working-directory: src
        run: |
          set -euo pipefail
          git fetch -q --no-tags "https://github.com/$UPSTREAM_REPO" "${{ needs.check.outputs.upstream_sha }}"
          git -c user.name=build -c user.email=build@localhost merge -q --no-edit FETCH_HEAD
      - name: Add extra commits
        working-directory: src
        run: bash ../kit/packaging/apply-extra-commits.sh "../kit/packaging/$EXTRA"
      - name: Check NEUTRINO support and redirect updater
        working-directory: src
        run: |
          set -euo pipefail
          test -f OpenUtau.Core/Neutrino/NeutrinoRenderer.cs
          grep -qF "$UPDATER_URL" "$UPDATER_FILE" || { echo "::error::updater URL not found; upstream changed"; exit 1; }
          sed -i '' "s#${UPDATER_URL}#https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100#" "$UPDATER_FILE"
          ! grep -qF "$UPDATER_URL" "$UPDATER_FILE"
      - name: Build
        working-directory: src
        run: |
          set -euo pipefail
          v="-p:Version=$VERSION -p:CFBundleVersion=$VERSION -p:CFBundleShortVersionString=$VERSION"
          dotnet publish OpenUtau -c Release -r osx-arm64 --self-contained true -o bin/osx-arm64/ $v
          dotnet msbuild OpenUtau -t:BundleApp -p:Configuration=Release -p:RuntimeIdentifier=osx-arm64 -p:UseAppHost=true -p:SelfContained=true -p:OutputPath=../bin/osx-arm64/ $v
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" bin/osx-arm64/publish/OpenUtau.app/Contents/Info.plist | grep -qxF "$VERSION"
          cp OpenUtau/Assets/OpenUtau.icns bin/osx-arm64/publish/OpenUtau.app/Contents/Resources/ || true
          codesign --force --deep -s - bin/osx-arm64/publish/OpenUtau.app
          codesign --verify --deep --strict bin/osx-arm64/publish/OpenUtau.app
      - name: Package dmg
        run: |
          set -euo pipefail
          p=pkg/OpenUtau-NEUTRINO; mkdir -p "$p"
          ditto src/bin/osx-arm64/publish/OpenUtau.app "$p/OpenUtau.app"
          cp kit/packaging/mac/NEUTRINOを登録.command kit/packaging/mac/NEUTRINOの登録を解除.command "$p/"
          chmod +x "$p/NEUTRINOを登録.command" "$p/NEUTRINOの登録を解除.command"
          kit/packaging/compose.sh mac > "$p/はじめにお読みください.md"
          ln -s /Applications "$p/Applications"
          # 登録スクリプトを仮のホームで試す
          fake=$(mktemp -d); ne=$(mktemp -d)/NEUTRINO; mkdir -p "$ne/bin" "$ne/model/TEST"; touch "$ne/bin/neutrino" "$ne/model/TEST/info.toml"
          xattr -w com.apple.quarantine "0081;00000000;Test;" "$ne/bin/neutrino"   # ダウンロードした状態を真似る
          HOME=$fake /bin/bash "$p/NEUTRINOを登録.command" "$ne"
          ! xattr -p com.apple.quarantine "$ne/bin/neutrino" 2>/dev/null   # 警告の印が外れている
          test -L "$fake/Library/OpenUtau/Dependencies/NEUTRINO_v3" && grep -q "singer_type: neutrino" "$fake/Library/OpenUtau/Singers/NEUTRINO_TEST/character.yaml"
          mkdir -p "$ne/model/ADD"; touch "$ne/model/ADD/info.toml"; rm -rf "$ne/model/TEST"      # モデルを足して・消して再実行
          HOME=$fake /bin/bash "$p/NEUTRINOを登録.command" "$ne"
          test -d "$fake/Library/OpenUtau/Singers/NEUTRINO_ADD" && test ! -e "$fake/Library/OpenUtau/Singers/NEUTRINO_TEST"
          before=$(find "$ne" | sort | shasum)
          HOME=$fake /bin/bash "$p/NEUTRINOの登録を解除.command"
          test ! -e "$fake/Library/OpenUtau/Dependencies/NEUTRINO_v3" && test ! -e "$fake/Library/OpenUtau/Singers/NEUTRINO_ADD"
          [ "$before" = "$(find "$ne" | sort | shasum)" ]   # 解除しても NEUTRINO は1つも消えない
          hdiutil create -volname OpenUtau-NEUTRINO -srcfolder "$p" -format UDZO -ov "OpenUtau-NEUTRINO${SUFFIX}-macos-arm64.dmg"
          codesign -fs - "OpenUtau-NEUTRINO${SUFFIX}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: "mac-${{ matrix.flavor }}", path: "OpenUtau-NEUTRINO${{ env.SUFFIX }}-macos-arm64.dmg", if-no-files-found: error }

  windows:
    needs: check
    if: needs.check.outputs.action == 'build'
    name: windows (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.check.outputs.flavors) }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      FLAVOR: ${{ matrix.flavor }}
      SUFFIX: ${{ matrix.flavor == 'latest' && '-latest' || '' }}
      EXTRA: ${{ matrix.flavor == 'latest' && 'extra-commits-latest.txt' || 'extra-commits.txt' }}
      VERSION: ${{ matrix.flavor == 'latest' && needs.check.outputs.latest_version || needs.check.outputs.version }}
      SOURCE_REPO: rokujyushi/OpenUtau
      SOURCE_REF: neutrino
      SOURCE_SHA: ${{ needs.check.outputs.sha }}
      SOURCE_DATE: ${{ needs.check.outputs.date }}
      BASE_VERSION: ${{ needs.check.outputs.version }}
      LATEST_VERSION: ${{ needs.check.outputs.latest_version }}
      LATEST_UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      LATEST_UPSTREAM_DATE: ${{ needs.check.outputs.upstream_date }}
    steps:
      - uses: actions/checkout@v4
        with: { path: kit }
      - uses: actions/checkout@v4
        with:
          repository: "${{ env.SRC_REPO }}"
          ref: "${{ needs.check.outputs.sha }}"
          path: src
          fetch-depth: ${{ matrix.flavor == 'latest' && '0' || '1' }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Merge the latest OpenUtau
        if: matrix.flavor == 'latest'
        working-directory: src
        run: |
          set -euo pipefail
          git fetch -q --no-tags "https://github.com/$UPSTREAM_REPO" "${{ needs.check.outputs.upstream_sha }}"
          git -c user.name=build -c user.email=build@localhost merge -q --no-edit FETCH_HEAD
      - name: Add extra commits
        working-directory: src
        run: bash ../kit/packaging/apply-extra-commits.sh "../kit/packaging/$EXTRA"
      - name: Check NEUTRINO support and redirect updater
        working-directory: src
        run: |
          set -euo pipefail
          test -f OpenUtau.Core/Neutrino/NeutrinoRenderer.cs
          grep -qF "$UPDATER_URL" "$UPDATER_FILE" || { echo "::error::updater URL not found; upstream changed"; exit 1; }
          sed -i "s#${UPDATER_URL}#https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100#" "$UPDATER_FILE"
          ! grep -qF "$UPDATER_URL" "$UPDATER_FILE"
      - name: Build
        working-directory: src
        run: |
          set -euo pipefail
          dotnet publish OpenUtau -c Release -r win-x64 --self-contained true -o ../pkg/OpenUtau-NEUTRINO/ -p:Version=$VERSION
          # 本家 CI と同じく DirectML を同梱する
          curl -fsSL https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -o dml.zip
          7z x -y -odml dml.zip > /dev/null
          cp dml/bin/x64-win/DirectML.dll ../pkg/OpenUtau-NEUTRINO/
      - name: Package zip
        run: |
          set -euo pipefail
          p=pkg/OpenUtau-NEUTRINO
          test -f "$p/OpenUtau.exe"
          cp kit/packaging/windows/*.ps1 kit/packaging/windows/*.bat "$p/"
          kit/packaging/compose.sh windows > "$p/はじめにお読みください.md"
      - name: Try the register script with a fake NEUTRINO
        shell: pwsh
        run: |
          $ne = Join-Path $env:RUNNER_TEMP "NEUTRINO"
          New-Item -ItemType Directory -Force -Path "$ne\bin", "$ne\model\TEST" | Out-Null
          Set-Content "$ne\bin\NEUTRINO.exe" "x"; Set-Content "$ne\model\TEST\info.toml" 'version = "v3.2.2"'; Set-Content "$ne\model\TEST\t.bin" "x"
          $t = Join-Path $env:RUNNER_TEMP "ou"; Copy-Item -Recurse pkg/OpenUtau-NEUTRINO $t
          powershell -NoProfile -ExecutionPolicy Bypass -File "$t\register-neutrino.ps1" -Neutrino "`"$ne`""
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-Item "$t\Dependencies\NEUTRINO_v3").LinkType -ne "Junction") { exit 1 }
          if (-not (Select-String -Quiet "singer_type: neutrino" "$t\Singers\NEUTRINO_TEST\character.yaml")) { exit 1 }
          if (-not (Test-Path "$t\Singers\NEUTRINO_TEST\t.bin")) { exit 1 }
          # モデルを足して・消して再実行
          New-Item -ItemType Directory -Force -Path "$ne\model\ADD" | Out-Null; Set-Content "$ne\model\ADD\info.toml" "x"
          Remove-Item -Recurse -Force "$ne\model\TEST"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$t\register-neutrino.ps1" -Neutrino "$ne"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$t\Singers\NEUTRINO_ADD") -or (Test-Path "$t\Singers\NEUTRINO_TEST")) { exit 1 }
          # 解除しても NEUTRINO は1つも消えない
          $before = (Get-ChildItem -Recurse $ne | ForEach-Object FullName) -join "|"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$t\unregister-neutrino.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Test-Path "$t\Dependencies\NEUTRINO_v3") -or (Test-Path "$t\Singers\NEUTRINO_ADD")) { exit 1 }
          if ($before -ne ((Get-ChildItem -Recurse $ne | ForEach-Object FullName) -join "|")) { Write-Host "NEUTRINO was modified"; exit 1 }
          Remove-Item -Recurse -Force $t
      - name: Zip
        run: cd pkg && 7z a -tzip "../OpenUtau-NEUTRINO${SUFFIX}-win-x64.zip" OpenUtau-NEUTRINO
      - uses: actions/upload-artifact@v4
        with: { name: "windows-${{ matrix.flavor }}", path: "OpenUtau-NEUTRINO${{ env.SUFFIX }}-win-x64.zip", if-no-files-found: error }

  release:
    needs: [check, mac, windows]
    # どちらかの版が作れなくても、作れた方は出す。docs の時はビルドせずに説明文だけを作り直す。
    if: always() && (needs.check.outputs.action == 'build' || needs.check.outputs.action == 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.check.outputs.action }}
          FLAVORS: ${{ needs.check.outputs.flavors || '[]' }}
          SOURCE_REPO: ${{ env.SRC_REPO }}
          SOURCE_REF: ${{ env.SRC_REF }}
          SOURCE_SHA: ${{ needs.check.outputs.sha }}
          SOURCE_DATE: ${{ needs.check.outputs.date }}
          NEW_VERSION: ${{ needs.check.outputs.version }}
          NEW_LATEST_VERSION: ${{ needs.check.outputs.latest_version }}
          NEW_UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
          NEW_UPSTREAM_DATE: ${{ needs.check.outputs.upstream_date }}
        run: |
          set -euo pipefail
          st=state/last-build.json
          prev_fixed=$(jq -r '.release_tag // ""' $st); prev_latest=$(jq -r '.latest.release_tag // ""' $st)
          # Release は日本時間の日ごとに1つ。同じ日に作り直した時は、増やさずに中身を差し替える。
          # 日が変わって初めて作った時は新しい Release を出すので、Releases に出る日付が最後に作った日になる。
          # 説明文だけを作り直す時は、今出ている Release を直す。
          if [ "$ACTION" = "docs" ]; then tag=${prev_latest:-$prev_fixed}
          else tag="neutrino-$(TZ=Asia/Tokyo date +%Y%m%d)"; fi
          mkdir -p dist
          wanted() { jq -e --arg f "$1" 'index($f) != null' <<<"$FLAVORS" > /dev/null; }
          # Mac と Windows の両方が揃った版だけを出す
          built() { [ -f "dist/OpenUtau-NEUTRINO$1-macos-arm64.dmg" ] && [ -f "dist/OpenUtau-NEUTRINO$1-win-x64.zip" ]; }
          exists=false; gh release view "$tag" > /dev/null 2>&1 && exists=true
          if [ "$ACTION" = "docs" ] && ! $exists; then
            echo "::error::説明文を作り直す Release ${tag} がありません"; exit 1
          fi
          # 今回作らなかった版は、前に出した Release から持ってくる (同じ Release ならそこに残っている物を使う)。
          # 新しい Release にも両方の版が揃うので、「最新の Release」へのリンクが切れない。
          carry() {
            [ -n "$2" ] || return 1
            [ "$2" = "$tag" ] && return 0
            gh release download "$2" -D dist --clobber \
              -p "OpenUtau-NEUTRINO$1-macos-arm64.dmg" -p "OpenUtau-NEUTRINO$1-win-x64.zip" && built "$1"
          }
          export BASE_VERSION="" LATEST_VERSION="" LATEST_UPSTREAM_SHA="" LATEST_UPSTREAM_DATE=""
          failed=(); fixed_ok=false; latest_ok=false; fixed_kept=false; latest_kept=false
          if built ""; then fixed_ok=true; BASE_VERSION=$NEW_VERSION
          else
            if wanted fixed; then failed+=("固定版"); fi
            if carry "" "$prev_fixed"; then fixed_kept=true; BASE_VERSION=$(jq -r '.version // ""' $st); fi
          fi
          if built "-latest"; then
            latest_ok=true
            LATEST_VERSION=$NEW_LATEST_VERSION; LATEST_UPSTREAM_SHA=$NEW_UPSTREAM_SHA; LATEST_UPSTREAM_DATE=$NEW_UPSTREAM_DATE
          else
            if wanted latest; then failed+=("最新版"); fi
            if carry "-latest" "$prev_latest"; then
              latest_kept=true
              LATEST_VERSION=$(jq -r '.latest.version // ""' $st)
              LATEST_UPSTREAM_SHA=$(jq -r '.latest.upstream_sha // ""' $st)
              LATEST_UPSTREAM_DATE=$(jq -r '.latest.upstream_date // ""' $st)
            fi
          fi
          if ! $fixed_ok && ! $latest_ok && [ "$ACTION" != "docs" ]; then
            echo "::error::どちらの版も作れませんでした"; exit 1
          fi
          files=()
          for s in "" "-latest"; do
            if built "$s"; then files+=("dist/OpenUtau-NEUTRINO$s-macos-arm64.dmg" "dist/OpenUtau-NEUTRINO$s-win-x64.zip"); fi
          done
          title="OpenUtau NEUTRINO対応版"  # 版やコミットは載せない
          if $exists; then
            [ ${#files[@]} -eq 0 ] || gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_REF_NAME" --latest --title "$title" --notes "準備中"
          fi
          packaging/compose.sh release > notes.md
          gh release edit "$tag" --title "$title" --notes-file notes.md --latest
          # 作れた版の記録だけを更新する
          new=$(cat "$st")
          if $fixed_ok; then
            extras=$(awk '!/^[[:space:]]*(#|$)/ {print $1}' packaging/extra-commits.txt | jq -R . | jq -s .)
            new=$(jq --arg sha "$SOURCE_SHA" --arg tag "$tag" --arg repo "$SOURCE_REPO" --arg ref "$SOURCE_REF" \
              --arg version "$NEW_VERSION" --argjson extras "$extras" \
              '.source_repo=$repo | .source_ref=$ref | .source_sha=$sha | .extra_commits=$extras | .version=$version | .release_tag=$tag' <<<"$new")
          fi
          if $latest_ok; then
            extras=$(awk '!/^[[:space:]]*(#|$)/ {print $1}' packaging/extra-commits-latest.txt | jq -R . | jq -s .)
            new=$(jq --arg sha "$SOURCE_SHA" --arg tag "$tag" --arg up "$NEW_UPSTREAM_SHA" --arg upd "$NEW_UPSTREAM_DATE" \
              --arg uprepo "$UPSTREAM_REPO" --arg version "$NEW_LATEST_VERSION" --argjson extras "$extras" \
              '.latest={source_sha:$sha, upstream_repo:$uprepo, upstream_sha:$up, upstream_date:$upd, extra_commits:$extras, version:$version, release_tag:$tag}' <<<"$new")
          fi
          # 前の Release から持ってきた版は、中身の記録はそのままで、置き場所だけを今の Release にする
          if $fixed_kept; then new=$(jq --arg tag "$tag" '.release_tag=$tag' <<<"$new"); fi
          if $latest_kept; then new=$(jq --arg tag "$tag" '.latest.release_tag=$tag' <<<"$new"); fi
          printf '%s\n' "$new" > "$st"
          packaging/compose.sh readme > README.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$st" README.md
          if ! git diff --cached --quiet; then
            if [ "$ACTION" = "docs" ]; then git commit -m "chore: ${tag} の説明を作り直す"; else git commit -m "chore: ${tag} を配布"; fi
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::作れなかった版があります: ${failed[*]}。前に出した物があれば、それを残しています"
            exit 1
          fi
